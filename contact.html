<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Blog</title>
    <link rel="stylesheet" href="this.css">
</head>

<body>

    <header>
        <h1>My Blog</h1>
        <p>Ideas, Stories and Knowledge</p>
    </header>

    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="this.html"><span class="site-logo">My Blog</span></a>
            <div class="nav-links">
                <a href="this.html">Home</a>
                <a href="this.html#latest">Blogs</a>
                <a href="about.html">About</a>
                <a href="contact.html" aria-current="page">Contact</a>
                <a class="nav-cta" href="contact.html">Subscribe</a>
            </div>
        </div>
    </nav>

    <main>

        <section class="intro">
            <h2>Get in Touch</h2>
            <p>
                Have a question, a suggestion or just want to say hello?
                Fill in the form below and I will get back to you.
            </p>
        </section>

        <section class="contact-form">
            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Blog. All rights reserved.</p>
    </footer>

</body>
</html>
